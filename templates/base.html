<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Monitor de Backups Duplicati{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Header & Navegação -->
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                        <path d="M16 16h5v5"/>
                    </svg>
                </div>
                <span>Duplicati<span style="color: var(--accent-blue);">Shield</span></span>
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Painel General</a></li>
                    <li><a href="/clients" class="nav-link {% if request.path == '/clients' %}active{% endif %}">Clientes & Jobs</a></li>
                    <li><a href="/history" class="nav-link {% if request.path == '/history' %}active{% endif %}">Histórico de Execuções</a></li>
                    <li><a href="/reports" class="nav-link {% if request.path == '/reports' %}active{% endif %}">Relatórios</a></li>
                    <li><a href="/webhook-guide" class="nav-link {% if request.path == '/webhook-guide' %}active{% endif %}">Guia Webhook</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Dinâmico -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <p>&copy; 2026 DuplicatiShield - Sistema Inteligente de Monitoramento e Gestão de Backups MySQL</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
