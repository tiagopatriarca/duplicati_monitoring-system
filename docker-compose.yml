services:
  # Serviço do Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: duplicati_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_super_secret
      MYSQL_DATABASE: duplicati_monitor
      MYSQL_USER: duplicati_user
      MYSQL_PASSWORD: duplicati_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_super_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Serviço da Aplicação Web em Python (Flask)
  web:
    build: .
    container_name: duplicati_web_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=duplicati_user
      - MYSQL_PASSWORD=duplicati_password_123
      - MYSQL_DB=duplicati_monitor
      - SECRET_KEY=duplicati_super_secret_key_2026
    depends_on:
      - db
    networks:
      - default
      - traefik_global_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.duplicati.rule=Host(`${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.duplicati.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.duplicati.tls=true"
      - "traefik.http.routers.duplicati.tls.certresolver=${CERT_RESOLVER:-myresolver}"
      - "traefik.http.services.duplicati.loadbalancer.server.port=5000"

volumes:
  mysql_data:
    driver: local

networks:
  traefik_global_net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_net}
